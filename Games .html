<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Madhira Games</title>

    <link rel="stylesheet" href="games.css">
</head>

<body>

    <div class="games-container">

        <h1>🎮 Madhira Games</h1>

        <p class="subtitle">Choose a game</p>

        <div class="games-grid">

            <button class="game-card" onclick="openAviator()">
                <div class="game-icon">✈️</div>
                <h2>Aviator</h2>
                <p>Play the demo game</p>
            </button>

            <button class="game-card">
                <div class="game-icon">🎲</div>
                <h2>Dice</h2>
                <p>Coming soon</p>
            </button>

            <button class="game-card">
                <div class="game-icon">💣</div>
                <h2>Mines</h2>
                <p>Coming soon</p>
            </button>

            <button class="game-card">
                <div class="game-icon">🔴</div>
                <h2>Plinko</h2>
                <p>Coming soon</p>
            </button>

        </div>

    </div>

    <script>

        function openAviator() {
            alert("Aviator game will open here.");
        }

    </script>

</body>
</html>
