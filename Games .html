<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Madhira Games</title>

    <link rel="stylesheet" href="games.css">
</head>

<body>

    <div class="games-container">

        <h1>🎮 Madhira Games</h1>

        <p class="subtitle">Choose a game</p>

        <div class="games-grid">

            <button class="game-card" onclick="openAviator()">
                <div class="game-icon">✈️</div>
                <h2>Aviator</h2>
                <p>Play the demo game</p>
            </button>

            <button class="game-card">
                <div class="game-icon">🎲</div>
                <h2>Dice</h2>
                <p>Coming soon</p>
            </button>

            <button class="game-card">
                <div class="game-icon">💣</div>
                <h2>Mines</h2>
                <p>Coming soon</p>
            </button>

            <button class="game-card">
                <div class="game-icon">🔴</div>
                <h2>Plinko</h2>
                <p>Coming soon</p>
            </button>

        </div>
<!-- AVIATOR GAME -->

<div id="aviator-game" class="aviator-game">

    <button class="back-button" onclick="closeAviator()">
        ← Back to Games
    </button>

    <h2>✈️ Aviator</h2>

    <div class="aviator-screen">

        <div id="aviator-multiplier">
            1.00x
        </div>

        <div id="aviator-plane">
            ✈️
        </div>

        <p id="aviator-status">
            Ready to play
        </p>

    </div>

    <div class="demo-balance">
        Demo Balance:
        <strong id="demo-balance">1000.00</strong>
    </div>

    <div class="aviator-controls">

        <input
            id="aviator-bet"
            type="number"
            min="1"
            value="10"
            placeholder="Bet amount"
        >

        <button
            id="start-button"
            onclick="startAviator()">
            🚀 Start
        </button>

        <button
            id="cashout-button"
            onclick="cashOutAviator()"
            disabled>
            💰 Cash Out
        </button>

    </div>

</div>
    </div>

    <script>

let demoBalance = 1000;

let aviatorRunning = false;
let aviatorInterval = null;
let aviatorMultiplier = 1;
let aviatorBet = 0;
let aviatorCrashPoint = 0;


function openAviator() {

    document.querySelector(".games-grid").style.display = "none";

    document.querySelector(".subtitle").style.display = "none";

    document.querySelector(".games-container h1").style.display = "none";

    document.getElementById("aviator-game").style.display = "block";

}

function startAviator() {

    if (aviatorRunning) {
        return;
    }

    aviatorBet = 10;

    if (aviatorBet > demoBalance) {
        alert("Not enough demo credits.");
        return;
    }

    demoBalance -= aviatorBet;

    aviatorMultiplier = 1;

    aviatorCrashPoint =
        (Math.random() * 4 + 1.2).toFixed(2);

    aviatorRunning = true;

    console.log("Crash point:", aviatorCrashPoint);

    aviatorInterval = setInterval(function () {

        aviatorMultiplier += 0.01;

        console.log(
            aviatorMultiplier.toFixed(2) + "x"
        );

        if (
            aviatorMultiplier >=
            Number(aviatorCrashPoint)
        ) {

            crashAviator();

        }

    }, 100);

}


function crashAviator() {

    clearInterval(aviatorInterval);

    aviatorRunning = false;

    console.log(
        "Plane crashed at " +
        aviatorCrashPoint +
        "x"
    );

}


function cashOutAviator() {

    if (!aviatorRunning) {
        return;
    }

    clearInterval(aviatorInterval);

    aviatorRunning = false;

    const winnings =
        aviatorBet * aviatorMultiplier;

    demoBalance += winnings;

    console.log(
        "Cashed out at " +
        aviatorMultiplier.toFixed(2) +
        "x"
    );

    console.log(
        "Demo balance:",
        demoBalance.toFixed(2)
    );

}

    </script>

</body>
</html>
