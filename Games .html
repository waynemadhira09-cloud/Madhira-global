<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madhira Games</title>

    <link rel="stylesheet" href="games.css">
</head>

<body>

<div class="games-container">

    <!-- GAMES MENU -->
    <section id="games-menu">

        <h1>🎮 Madhira Games</h1>

        <p class="subtitle">Choose a game</p>

        <div class="games-grid">

            <button class="game-card" onclick="openAviator()">
                <div class="game-icon">✈️</div>
                <h2>Aviator</h2>
                <p>Play</p>
            </button>

            <button class="game-card" onclick="comingSoon('Dice')">
                <div class="game-icon">🎲</div>
                <h2>Dice</h2>
                <p>Coming soon</p>
            </button>

            <button class="game-card" onclick="comingSoon('Mines')">
                <div class="game-icon">💣</div>
                <h2>Mines</h2>
                <p>Coming soon</p>
            </button>

            <button class="game-card" onclick="comingSoon('Plinko')">
                <div class="game-icon">🔴</div>
                <h2>Plinko</h2>
                <p>Coming soon</p>
            </button>

        </div>

    </section>


    <!-- AVIATOR -->
    <section id="aviator-game">

        <button class="back-button" onclick="closeAviator()">
            ← Back
        </button>

        <h1>✈️ Aviator</h1>

        <p class="demo-label">
            Virtual credits only
        </p>


        <!-- GAME SCREEN -->
        <div class="aviator-screen">

            <div
                id="aviator-multiplier"
                class="aviator-multiplier">
                1.00x
            </div>

            <div
                id="aviator-plane"
                class="aviator-plane">
                ✈️
            </div>

            <div
                id="aviator-status"
                class="aviator-status">
                Ready
            </div>

        </div>


        <!-- BALANCE -->
        <div class="demo-balance">

            <span>Virtual Balance</span>

            <strong id="demo-balance">
                1000.00
            </strong>

            <span>credits</span>

        </div>


        <!-- BET -->
        <div class="aviator-controls">

            <label for="aviator-bet">
                Bet amount
            </label>

            <input
                id="aviator-bet"
                type="number"
                min="1"
                max="1000"
                value="10"
            >


            <button
                id="start-button"
                class="start-button"
                onclick="startAviator()">

                🚀 Start Round

            </button>


            <button
                id="cashout-button"
                class="cashout-button"
                onclick="cashOutAviator()"
                disabled>

                💰 Cash Out

            </button>

        </div>


        <!-- RESULT -->
        <div
            id="aviator-result"
            class="aviator-result">
        </div>

    </section>

</div>


<script>

/* =========================
   GAME VARIABLES
========================= */

let virtualBalance = 1000;

let aviatorRunning = false;

let aviatorInterval = null;

let aviatorMultiplier = 1;

let aviatorBet = 0;

let aviatorCrashPoint = 0;


/* =========================
   OPEN AVIATOR
========================= */

function openAviator() {

    document.getElementById("games-menu").style.display = "none";

    document.getElementById("aviator-game").style.display = "block";

    updateBalance();

}


/* =========================
   CLOSE AVIATOR
========================= */

function closeAviator() {

    if (aviatorRunning) {

        clearInterval(aviatorInterval);

        aviatorRunning = false;

    }

    document.getElementById("aviator-game").style.display = "none";

    document.getElementById("games-menu").style.display = "block";

    resetGame();

}


/* =========================
   COMING SOON
========================= */

function comingSoon(game) {

    alert(game + " is coming soon.");

}


/* =========================
   BALANCE
========================= */

function updateBalance() {

    document.getElementById("demo-balance").textContent =
        virtualBalance.toFixed(2);

}


/* =========================
   START ROUND
========================= */

function startAviator() {

    if (aviatorRunning) {
        return;
    }


    const input =
        document.getElementById("aviator-bet");


    aviatorBet =
        Number(input.value);


    if (!Number.isFinite(aviatorBet) || aviatorBet < 1) {

        alert("Enter a valid amount.");

        return;
    }


    if (aviatorBet > virtualBalance) {

        alert("Not enough virtual credits.");

        return;
    }


    /* Deduct virtual credits */

    virtualBalance -= aviatorBet;

    updateBalance();


    /* Reset */

    aviatorMultiplier = 1;

    aviatorRunning = true;


    /* Random crash point */

    aviatorCrashPoint =
        Number(
            (Math.random() * 6.8 + 1.2).toFixed(2)
        );


    /* Buttons */

    document.getElementById("start-button").disabled = true;

    document.getElementById("cashout-button").disabled = false;


    /* Text */

    document.getElementById("aviator-status").textContent =
        "🚀 Flying...";

    document.getElementById("aviator-result").textContent =
        "";


    /* Multiplier */

    document.getElementById("aviator-multiplier").textContent =
        "1.00x";


    /* Plane */

    document.getElementById("aviator-plane").style.left =
        "30px";

    document.getElementById("aviator-plane").style.bottom =
        "35px";


    /* Game loop */

    aviatorInterval = setInterval(function() {

        aviatorMultiplier += 0.01;


        /* Update multiplier */

        document.getElementById(
            "aviator-multiplier"
        ).textContent =
            aviatorMultiplier.toFixed(2) + "x";


        /* Move plane */

        const screen =
            document.querySelector(".aviator-screen");

        const maxLeft =
            screen.clientWidth - 80;

        const maxBottom =
            screen.clientHeight - 100;

        const progress =
            Math.min(
                (aviatorMultiplier - 1) / 6,
                1
            );


        document.getElementById(
            "aviator-plane"
        ).style.left =
            (30 + progress * maxLeft) + "px";


        document.getElementById(
            "aviator-plane"
        ).style.bottom =
            (35 + progress * maxBottom) + "px";


        /* Crash */

        if (
            aviatorMultiplier >=
            aviatorCrashPoint
        ) {

            crashAviator();

        }

    }, 100);

}


/* =========================
   CRASH
========================= */

function crashAviator() {

    clearInterval(aviatorInterval);

    aviatorRunning = false;


    document.getElementById(
        "aviator-status"
    ).textContent =
        "💥 Crashed";


    document.getElementById(
        "aviator-result"
    ).textContent =
        "The plane crashed at " +
        aviatorCrashPoint.toFixed(2) +
        "x.";


    document.getElementById(
        "start-button"
    ).disabled = false;


    document.getElementById(
        "cashout-button"
    ).disabled = true;

}


/* =========================
   CASH OUT
========================= */

function cashOutAviator() {

    if (!aviatorRunning) {
        return;
    }


    clearInterval(aviatorInterval);

    aviatorRunning = false;


    const winnings =
        aviatorBet * aviatorMultiplier;


    virtualBalance += winnings;

    updateBalance();


    document.getElementById(
        "aviator-status"
    ).textContent =
        "💰 Cashed Out";


    document.getElementById(
        "aviator-result"
    ).textContent =
        "Cashed out at " +
        aviatorMultiplier.toFixed(2) +
        "x — +" +
        winnings.toFixed(2) +
        " credits";


    document.getElementById(
        "start-button"
    ).disabled = false;


    document.getElementById(
        "cashout-button"
    ).disabled = true;

}


/* =========================
   RESET
========================= */

function resetGame() {

    document.getElementById(
        "aviator-multiplier"
    ).textContent =
        "1.00x";


    document.getElementById(
        "aviator-status"
    ).textContent =
        "Ready";


    document.getElementById(
        "aviator-result"
    ).textContent =
        "";


    document.getElementById(
        "aviator-plane"
    ).style.left =
        "30px";


    document.getElementById(
        "aviator-plane"
    ).style.bottom =
        "35px";


    document.getElementById(
        "start-button"
    ).disabled = false;


    document.getElementById(
        "cashout-button"
    ).disabled = true;

}

</script>

</body>
</html>
