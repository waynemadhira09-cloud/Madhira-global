<!-- Background Overlay Mask (Dims the rest of the screen) -->
<div id="sidebarOverlay" class="drawer-overlay-mask" onclick="toggleSidebarMenu()"></div>

<!-- The Navy Blue Sidebar Panel -->
<div id="sideDrawer" class="my-sidebar-panel">
  <div class="sidebar-inner-box">
    
    <!-- Games Container Box -->
    <div class="sidebar-group-card">
      <div class="sidebar-header-title">
        <span>GAMES</span>
        <i class="fa-solid fa-chevron-up"></i>
      </div>
      <div class="sidebar-items-list">
        
        <!-- Madhira Global -->
        <a href="#" class="sidebar-link item-highlight-blue">
          <i class="fa-solid fa-globe icon-gold"></i>
          <span>Madhira Global</span>
        </a>

        <!-- Aviator (Red Slanted Style) -->
        <a href="#" class="sidebar-link item-brand-red">
          <i class="fa-solid fa-plane-departure"></i>
          <span>Aviator</span>
        </a>

        <!-- All Games -->
        <a href="#" class="sidebar-link">
          <i class="fa-solid fa-gamepad icon-gold"></i>
          <span>All Games</span>
        </a>

        <!-- Market List -->
        <a href="#" class="sidebar-link">
          <i class="fa-solid fa-list-check icon-gold"></i>
          <span>Market List</span>
        </a>

      </div>
    </div>

  </div>
</div>

<script>
  // Helper function to close the menu if the user clicks out on the dark background
  function toggleSidebarMenu() {
    const drawer = document.getElementById('sideDrawer');
    const overlay = document.getElementById('sidebarOverlay');
    if(drawer) drawer.classList.remove('sidebar-is-open');
    if(overlay) overlay.classList.remove('overlay-is-visible');
  }
</script>
