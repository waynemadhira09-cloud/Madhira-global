<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Navigation</title>
    <!-- FontAwesome Library for Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Link to the sidebar stylesheet -->
    <link rel="stylesheet" href="sidebar.css">
</head>
<body>

    <div class="sidebar-container">
        
        <!-- 1. Header Branding Section -->
        <div class="sidebar-header">
            <div class="logo">
                <span class="logo-yellow">madhira</span><span class="logo-white"> global</span>
            </div>
        </div>

        <!-- 2. Main Action Blocks (VIP & Jackpot) -->
        <div class="action-blocks">
            <a href="#vip" class="block-btn vip-btn">
                <i class="fa-solid fa-crown"></i> VIP
            </a>
            <a href="#jackpot" class="block-btn jackpot-btn">
                <i class="fa-solid fa-slot-machine"></i> Madhira Jackpot
            </a>
        </div>

        <!-- 3. Accordion Categories -->
        <div class="menu-sections">
            
            <!-- SPORTS SECTION -->
            <div class="section-group">
                <div class="section-trigger">
                    <span>SPORTS</span>
                    <i class="fa-solid fa-chevron-up"></i>
                </div>
                <div class="section-content open">
                    <a href="#soccer" class="menu-item">
                        <i class="fa-solid fa-circle-notch yellow-icon"></i> Soccer
                    </a>
                </div>
            </div>

            <!-- GAMES SECTION -->
            <div class="section-group">
                <div class="section-trigger">
                    <span>GAMES</span>
                    <i class="fa-solid fa-chevron-up"></i>
                </div>
                <div class="section-content open">
                    <!-- Special Red Aviator Button -->
                    <a href="#aviator" class="menu-item aviator-btn">
                        <i class="fa-solid fa-plane-slant"></i> Aviator
                    </a>
                    
                    <a href="#all-games" class="menu-item">
                        <i class="fa-solid fa-gamepad"></i> All Games
                    </a>
                    <a href="#popular" class="menu-item">
                        <i class="fa-solid fa-fire"></i> Popular
                    </a>
                    <a href="#virtual" class="menu-item">
                        <i class="fa-solid fa-vr-cardboard"></i> Virtual Sports
                    </a>
                    <a href="#crash" class="menu-item">
                        <i class="fa-solid fa-chart-line-up"></i> Crash Game
                    </a>
                    <a href="#turbo" class="menu-item">
                        <i class="fa-solid fa-bolt"></i> Turbo Games
                    </a>
                    <a href="#slots" class="menu-item">
                        <i class="fa-solid fa-cubes"></i> Slots
                    </a>
                    <a href="#fish" class="menu-item">
                        <i class="fa-solid fa-fish"></i> Fish
                    </a>
                    <a href="#bingo" class="menu-item">
                        <i class="fa-solid fa-ticket"></i> Bingo
                    </a>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
