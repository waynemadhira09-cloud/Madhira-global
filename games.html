<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Madhira Games</title>

    <link rel="stylesheet" href="games.css">
</head>

<body>

<div class="games-container">

    <!-- =========================
         GAMES MENU
    ========================== -->

    <section id="games-menu">

        <h1>🎮 Madhira Games</h1>

        <p class="subtitle">
            Choose a game
        </p>


        <div class="games-grid">

            <!-- AVIATOR -->

            <button
                type="button"
                class="game-card"
                onclick="openAviator()"
            >

                <div class="game-icon">
                    ✈️
                </div>

                <h2>
                    Aviator
                </h2>

                <p>
                    Play with Virtual Credits
                </p>

            </button>


            <!-- DICE -->

            <button
                type="button"
                class="game-card"
                onclick="comingSoon('Dice')"
            >

                <div class="game-icon">
                    🎲
                </div>

                <h2>
                    Dice
                </h2>

                <p>
                    Coming soon
                </p>

            </button>


            <!-- MINES -->

            <button
                type="button"
                class="game-card"
                onclick="comingSoon('Mines')"
            >

                <div class="game-icon">
                    💣
                </div>

                <h2>
                    Mines
                </h2>

                <p>
                    Coming soon
                </p>

            </button>


            <!-- PLINKO -->

            <button
                type="button"
                class="game-card"
                onclick="comingSoon('Plinko')"
            >

                <div class="game-icon">
                    🃏
                </div>

                <h2>
                    Plinko
                </h2>

                <p>
                    Coming soon
                </p>

            </button>

        </div>

    </section>


    <!-- =========================
         AVIATOR GAME
         
         HIDDEN FOR NOW
    ========================== -->

    <section
        id="aviator-game"
        style="display: none;"
    >

        <button
            type="button"
            class="back-button"
            onclick="closeAviator()"
        >
            ← Back
        </button>

        <h1>✈️ Aviator</h1>

        <p class="demo-label">
            VIRTUAL CREDITS ONLY
        </p>


        <div class="aviator-screen">

            <div
                class="aviator-multiplier"
                id="aviator-multiplier"
            >
                1.00x
            </div>

            <div
                class="aviator-plane"
                id="aviator-plane"
            >
                ✈️
            </div>

            <div
                class="aviator-status"
                id="aviator-status"
            >
                Ready
            </div>

        </div>


        <div class="demo-balance">

            <span>
                Virtual Balance:
            </span>

            <strong id="demo-balance">
                1000
            </strong>

        </div>


        <div class="aviator-controls">

            <label for="aviator-bet">
                Virtual Credits
            </label>

            <input
                type="number"
                id="aviator-bet"
                value="100"
                min="1"
            >

            <button
                type="button"
                id="start-button"
            >
                Start
            </button>

            <button
                type="button"
                id="cashout-button"
                disabled
            >
                Cashout
            </button>

        </div>


        <div
            class="aviator-result"
            id="aviator-result"
        ></div>

    </section>

</div>


<!-- =========================
     JAVASCRIPT
========================== -->

<script>

function openAviator() {

    /*
       Aviator is hidden for now.
       We will activate it later.
    */

    alert("Aviator — Play with Virtual Credits");

}


function closeAviator() {

    document.getElementById("aviator-game").style.display = "none";

    document.getElementById("games-menu").style.display = "block";

}


function comingSoon(gameName) {

    alert(gameName + " is coming soon.");

}

</script>

</body>
</html>
