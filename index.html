<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MADHIRA GLOBAL</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- =====================================================
     AUTHENTICATION
===================================================== -->

<div id="auth-container">

    <div class="auth-box">

        <h1>MADHIRA GLOBAL</h1>

        <p id="auth-title">Create your account</p>


        <!-- SIGN UP -->

        <form id="signup-form" onsubmit="handleAuthentication(event, 'signup')">

            <div class="input-group">

                <label>Profile Picture</label>

                <input
                    type="file"
                    id="signup-photo"
                    accept="image/*"
                >

            </div>


            <div class="input-group">

                <label>First Name</label>

                <input
                    type="text"
                    id="first-name"
                    placeholder="Enter first name"
                    required
                >

            </div>


            <div class="input-group">

                <label>Last Name</label>

                <input
                    type="text"
                    id="last-name"
                    placeholder="Enter last name"
                    required
                >

            </div>


            <div class="input-group">

                <label>Country</label>

                <input
                    type="text"
                    id="country"
                    placeholder="Enter country"
                    required
                >

            </div>


            <div class="input-group">

                <label>Location</label>

                <input
                    type="text"
                    id="location"
                    placeholder="Enter your location"
                    required
                >

            </div>


            <div class="input-group">

                <label>Contact</label>

                <input
                    type="tel"
                    id="contact"
                    placeholder="Enter phone number"
                    required
                >

            </div>


            <div class="input-group">

                <label>Email</label>

                <input
                    type="email"
                    id="signup-email"
                    placeholder="Enter email"
                    required
                >

            </div>


            <div class="input-group">

                <label>Password</label>

                <input
                    type="password"
                    id="signup-password"
                    placeholder="Create password"
                    required
                >

            </div>
