<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>MADHIRA GLOBAL</title>


<style>

/* ========================================================
   GLOBAL
   ======================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background-color: #0b1426;
    color: #ffffff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
}


/* ========================================================
   AUTHENTICATION
   ======================================================== */

#auth-screen {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    width: 100%;
    max-width: 450px;
    padding: 20px;
    text-align: center;
}

.brand-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
}

.brand-logo {
    font-size: 2rem;
    font-weight: bold;
}

.hero-title {
    font-size: 2.2rem;
    margin-bottom: 12px;
    line-height: 1.3;
}

.hero-tagline {
    color: #8fa0dd;
    margin-bottom: 40px;
    font-size: 1rem;
}

.auth-box {
    background-color: #131c2e;
    width: 100%;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    display: none;
}

.auth-box.active {
    display: block;
}

.auth-box h2 {
    font-size: 1.5rem;
    margin-bottom: 20px;
}

.input-group {
    margin-bottom: 16px;
    text-align: left;
}

.input-group label {
    display: block;
    font-size: 0.85rem;
    color: #8fa0dd;
    margin-bottom: 6px;
}

.input-group input,
.input-group select {
    width: 100%;
    padding: 12px;
    background: #1e2d4a;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    color: #fff;
    outline: none;
    font-size: 0.95rem;
}

.input-group input:focus,
.input-group select:focus {
    border-color: #2b6cb0;
}

.submit-btn {
    width: 100%;
    padding: 12px;
    background-color: #2b6cb0;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

.toggle-link {
    margin-top: 20px;
    font-size: 0.9rem;
    color: #8fa0dd;
}

.toggle-link span {
    color: #2b6cb0;
    cursor: pointer;
    font-weight: bold;
}


/* ========================================================
   MAIN PLATFORM
   ======================================================== */

#main-platform {
    display: none;
    width: 100%;
    max-width: 600px;
    padding: 20px;
}

.top-navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 0;
    margin-bottom: 30px;
}

.nav-buttons {
    display: flex;
    align-items: center;
    gap: 5px;
}

.search-container {
    text-align: center;
    margin-bottom: 40px;
}

.search-bar-wrapper {
    background: white;
    border-radius: 8px;
    padding: 8px;
    display: flex;
    margin-top: 20px;
}

.search-bar-wrapper input {
    flex: 1;
    border: none;
    padding: 10px;
    outline: none;
    font-size: 1rem;
}

.search-btn {
    background-color: #2b6cb0;
    color: white;
    border: none;
    padding: 10px 24px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
}

.categories-section h3 {
    font-size: 1.4rem;
    margin-bottom: 20px;
}

.grid-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
}

.category-card {
    background-color: #ffffff;
    color: #333333;
    padding: 24px;
    border-radius: 8px;
    text-align: center;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}

.category-icon {
    display: block;
    font-size: 1.5rem;
    margin-bottom: 8px;
}


/* ========================================================
   WALLET
   ======================================================== */

#wallet-dashboard {
    display: none;
    width: 100%;
    max-width: 600px;
    padding: 20px;
}

.wallet-header {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 25px;
}

.wallet-header h2 {
    margin: 0;
    font-size: 1.5rem;
}

.back-btn {
    background: #131c2e;
    border: 1px solid rgba(255,255,255,0.2);
    margin: 0;
    color: white;
    padding: 10px 15px;
    border-radius: 6px;
    cursor: pointer;
}

.wallet-balance-card {
    background: #131c2e;
    color: white;
    padding: 25px;
    border-radius: 14px;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}

.wallet-balance-card p {
    color: #8fa0dd;
    margin-bottom: 8px;
}

.wallet-balance-card h1 {
    font-size: 32px;
    margin: 10px 0 25px;
    color: white;
}

.wallet-actions {
    display: flex;
    gap: 10px;
}

.wallet-actions button {
    flex: 1;
    margin: 0;
    background: #2b6cb0;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 6px;
    cursor: pointer;
}

.wallet-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-top: 18px;
}

.wallet-stat {
    background: #131c2e;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

.wallet-stat span {
    display: block;
    color: #8fa0dd;
    font-size: 14px;
    margin-bottom: 8px;
}

.wallet-stat strong {
    font-size: 18px;
    color: white;
}

.transactions {
    background: #131c2e;
    margin-top: 20px;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

.transactions h3 {
    margin-bottom: 15px;
}

.empty-transactions {
    color: #8fa0dd;
    text-align: center;
    padding: 25px 0;
}

.wallet-btn {
    background: #2b6cb0;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
}


/* ========================================================
   SELL
   ======================================================== */

#sell-dashboard {
    display: none;
    width: 100%;
    max-width: 600px;
    padding: 20px;
}

.sell-box {
    background: #131c2e;
    padding: 25px;
    border-radius: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}

.sell-box h3 {
    margin-bottom: 20px;
    font-size: 1.3rem;
}

.sell-input-group {
    margin-bottom: 16px;
}

.sell-input-group label {
    display: block;
    font-size: 0.85rem;
    color: #8fa0dd;
    margin-bottom: 6px;
}

.sell-input-group input,
.sell-input-group select,
.sell-input-group textarea {
    width: 100%;
    padding: 12px;
    background: #1e2d4a;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    color: #fff;
    outline: none;
    font-size: 0.95rem;
}

.sell-input-group textarea {
    min-height: 120px;
    resize: vertical;
}

.sell-input-group input:focus,
.sell-input-group select:focus,
.sell-input-group textarea:focus {
    border-color: #2b6cb0;
}

.sell-input-group select option {
    background: #1e2d4a;
    color: white;
}

.image-preview {
    width: 100%;
    max-height: 250px;
    object-fit: contain;
    display: none;
    margin-top: 10px;
    border-radius: 8px;
    background: #0b1426;
}


/* ========================================================
   MARKETPLACE
   ======================================================== */

#marketplace-listings {
    margin-top: 40px;
    display: none;
}

.listing-card {
    background: #131c2e;
    border-radius: 12px;
    margin-bottom: 18px;
    overflow: hidden;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

.listing-image {
    width: 100%;
    height: 220px;
    object-fit: cover;
    background: #1e2d4a;
}

.listing-content {
    padding: 18px;
}

.listing-content h3 {
    margin-bottom: 8px;
}

.listing-price {
    color: #5da9ff;
    font-size: 1.2rem;
    font-weight: bold;
    margin-bottom: 10px;
}

.listing-info {
    color: #8fa0dd;
    font-size: 0.9rem;
    margin-bottom: 8px;
}

.listing-description {
    color: #d8def5;
    margin-top: 12px;
    line-height: 1.5;
}


/* ========================================================
   ACCOUNT DASHBOARD
   ======================================================== */

#account-dashboard {
    display: none;
    width: 100%;
    max-width: 600px;
    padding: 20px;
}

.account-header {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 25px;
}

.account-header h2 {
    margin: 0;
    font-size: 1.5rem;
}

.account-box {
    background: #131c2e;
    padding: 25px;
    border-radius: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}


/* ========================================================
   PROFILE PICTURE
   ======================================================== */

.profile-picture-section {
    text-align: center;
    margin-bottom: 30px;
}

.profile-picture {
    width: 125px;
    height: 125px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    margin: 0 auto 15px;
    background: #1e2d4a;
    border: 4px solid #2b6cb0;
}

.profile-placeholder {
    width: 125px;
    height: 125px;
    border-radius: 50%;
    background: #1e2d4a;
    border: 4px solid #2b6cb0;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 15px;
    font-size: 55px;
}

.profile-picture-section p {
    color: #8fa0dd;
    font-size: 13px;
    margin-bottom: 12px;
}

.profile-picture-section input[type="file"] {
    width: 100%;
    padding: 10px;
    background: #1e2d4a;
    color: white;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
}


/* ========================================================
   ACCOUNT FIELDS
   ======================================================== */

.account-info-group {
    margin-bottom: 16px;
}

.account-info-group label {
    display: block;
    color: #8fa0dd;
    font-size: 0.85rem;
    margin-bottom: 6px;
}

.account-info-group input,
.account-info-group select {
    width: 100%;
    padding: 12px;
    background: #1e2d4a;
    color: white;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    outline: none;
    font-size: 0.95rem;
}

.account-info-group input:focus,
.account-info-group select:focus {
    border-color: #2b6cb0;
}


/* ========================================================
   ID VERIFICATION
   ======================================================== */

.id-verification-box {
    background: #1e2d4a;
    border: 1px solid rgba(255,255,255,0.1);
    padding: 18px;
    border-radius: 10px;
    margin-top: 22px;
}

.id-verification-box h3 {
    margin-bottom: 8px;
    font-size: 1rem;
}

.id-verification-box p {
    color: #8fa0dd;
    font-size: 13px;
    line-height: 1.5;
    margin-bottom: 12px;
}

.id-status {
    display: inline-block;
    padding: 6px 12px;
    border-radius: 20px;
    background: #594214;
    color: #ffd666;
    font-size: 12px;
    font-weight: bold;
}


/* ========================================================
   SECURITY NOTE
   ======================================================== */

.security-note {
    margin-top: 20px;
    padding: 15px;
    background: #0b1426;
    border-radius: 8px;
    border-left: 3px solid #2b6cb0;
}

.security-note p {
    color: #8fa0dd;
    font-size: 13px;
    line-height: 1.5;
}


/* ========================================================
   ACCOUNT BUTTON
   ======================================================== */

.account-btn {
    background: #131c2e;
    color: white;
    border: 1px solid rgba(255,255,255,0.2);
    padding: 10px 15px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
}


/* ========================================================
   MOBILE
   ======================================================== */

@media (max-width: 500px) {

    #wallet-dashboard,
    #sell-dashboard,
    #account-dashboard {
        padding: 20px;
    }

    .wallet-actions {
        flex-direction: column;
    }

    .wallet-stats {
        grid-template-columns: 1fr;
    }

    .wallet-header,
    .account-header {
        flex-wrap: wrap;
    }

    .top-navbar {
        align-items: flex-start;
    }

    .nav-buttons {
        flex-wrap: wrap;
        justify-content: flex-end;
    }

    .account-box,
    .sell-box {
        padding: 20px;
    }

}

</style>

</head>


<body>


<!-- ========================================================
     STAGE 1: AUTHENTICATION
     ======================================================== -->

<div id="auth-screen">

    <div class="brand-header">

        <span style="font-size:2.2rem;">🌐</span>

        <span class="brand-logo">
            Madhira Global
        </span>

    </div>


    <h1 class="hero-title">
        Buy & Sell Anything Worldwide
    </h1>


    <p class="hero-tagline">
        Find products from sellers around the world.
    </p>


    <!-- SIGN IN -->

    <div id="signin-box" class="auth-box active">

        <h2>
            Sign In
        </h2>


        <form onsubmit="handleAuthentication(event)">

            <div class="input-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    id="signin-email"
                    required
                    placeholder="name@example.com"
                >

            </div>


            <div class="input-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    required
                    placeholder="••••••••"
                >

            </div>


            <button
                type="submit"
                class="submit-btn"
            >
                Sign In
            </button>

        </form>


        <div class="toggle-link">

            New to the platform?

            <span onclick="switchForm('signup')">
                Sign Up here
            </span>

        </div>

    </div>



    <!-- SIGN UP -->

    <div id="signup-box" class="auth-box">

        <h2>
            Create Account
        </h2>


        <form onsubmit="handleAuthentication(event)">


            <div class="input-group">

                <label>
                    Country
                </label>

                <select
                    id="signup-country"
                    required
                >

                    <option value="">
                        Select your country
                    </option>

                    <option>Kenya</option>
                    <option>Uganda</option>
                    <option>Tanzania</option>
                    <option>Rwanda</option>
                    <option>South Africa</option>
                    <option>Nigeria</option>
                    <option>Ghana</option>
                    <option>United States</option>
                    <option>United Kingdom</option>
                    <option>Canada</option>
                    <option>Australia</option>
                    <option>India</option>
                    <option>China</option>
                    <option>Germany</option>
                    <option>France</option>
                    <option>Italy</option>
                    <option>Spain</option>
                    <option>Brazil</option>
                    <option>Other</option>

                </select>

            </div>


            <div class="input-group">

                <label>
                    First Name
                </label>

                <input
                    type="text"
                    id="signup-first-name"
                    required
                    placeholder="Enter your first name"
                >

            </div>


            <div class="input-group">

                <label>
                    Last Name
                </label>

                <input
                    type="text"
                    id="signup-last-name"
                    required
                    placeholder="Enter your last name"
                >

            </div>


            <div class="input-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    id="signup-email"
                    required
                    placeholder="name@example.com"
                >

            </div>


            <div class="input-group">

                <label>
                    Contact
                </label>

                <input
                    type="tel"
                    id="signup-contact"
                    required
                    placeholder="Phone number"
                >

            </div>


            <div class="input-group">

                <label>
                    Location
                </label>

                <input
                    type="text"
                    id="signup-location"
                    required
                    placeholder="City / Town"
                >

            </div>


            <div class="input-group">

                <label>
                    ID / Passport Number
                </label>

                <input
                    type="text"
                    id="signup-id"
                    required
                    placeholder="Enter ID or Passport number"
                >

            </div>


            <div class="input-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="signup-password"
                    required
                    placeholder="Create password"
                >

            </div>


            <div class="input-group">

                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="signup-confirm-password"
                    required
                    placeholder="Confirm password"
                >

            </div>


            <button
                type="submit"
                class="submit-btn"
            >
                Create Account
            </button>

        </form>


        <div class="toggle-link">

            Already have an account?

            <span onclick="switchForm('signin')">
                Sign In here
            </span>

        </div>

    </div>

</div>



<!-- ========================================================
     STAGE 2: MAIN PLATFORM
     ======================================================== -->

<div id="main-platform">


    <header class="top-navbar">


        <div
            class="brand-header"
            style="margin-bottom:0;"
        >

            <span>
                🌐
            </span>

            <span
                class="brand-logo"
                style="font-size:1.4rem;"
            >
                Madhira Global
            </span>

        </div>


        <div class="nav-buttons">


            <!-- ACCOUNT -->

            <button
                class="account-btn"
                onclick="openAccount()"
            >
                👤 Account
            </button>


            <!-- SELL -->

            <button
                class="search-btn"
                onclick="openSell()"
                style="background:#131c2e;border:1px solid rgba(255,255,255,0.2);"
            >
                Sell
            </button>


            <!-- WALLET -->

            <button
                class="wallet-btn"
                onclick="openWallet()"
            >
                💰 Wallet
            </button>


        </div>

    </header>



    <!-- SEARCH -->

    <section class="search-container">

        <div class="search-bar-wrapper">

            <input
                type="text"
                id="search-input"
                placeholder="What are you looking for?"
            >

            <button
                class="search-btn"
                onclick="search
