<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Madhira Global</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background-color: #0b1426;
    color: #ffffff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
}


/* ========================================================
   1. INITIAL AUTHENTICATION SCREEN
   ======================================================== */

#auth-screen {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    width: 100%;
    max-width: 450px;
    padding: 20px;
    text-align: center;
}

.brand-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
}

.brand-logo {
    font-size: 2rem;
    font-weight: bold;
}

.hero-title {
    font-size: 2.2rem;
    margin-bottom: 12px;
    line-height: 1.3;
}

.hero-tagline {
    color: #8fa0dd;
    margin-bottom: 40px;
    font-size: 1rem;
}

.auth-box {
    background-color: #131c2e;
    width: 100%;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    display: none;
}

.auth-box.active {
    display: block;
}

.auth-box h2 {
    font-size: 1.5rem;
    margin-bottom: 20px;
}

.input-group {
    margin-bottom: 16px;
    text-align: left;
}

.input-group label {
    display: block;
    font-size: 0.85rem;
    color: #8fa0dd;
    margin-bottom: 6px;
}

.input-group input,
.input-group select {
    width: 100%;
    padding: 12px;
    background: #1e2d4a;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    color: #fff;
    outline: none;
    font-size: 0.95rem;
}

.input-group input:focus,
.input-group select:focus {
    border-color: #2b6cb0;
}

.input-group select option {
    background: #1e2d4a;
    color: white;
}

.submit-btn {
    width: 100%;
    padding: 12px;
    background-color: #2b6cb0;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

.submit-btn:hover {
    opacity: 0.85;
}

.toggle-link {
    margin-top: 20px;
    font-size: 0.9rem;
    color: #8fa0dd;
}

.toggle-link span {
    color: #2b6cb0;
    cursor: pointer;
    font-weight: bold;
}


/* ========================================================
   2. MAIN DASHBOARD
   ======================================================== */

#main-platform {
    display: none;
    width: 100%;
    max-width: 600px;
    padding: 20px;
}

.top-navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 0;
    margin-bottom: 30px;
    gap: 10px;
}

.nav-buttons {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: flex-end;
}

.search-container {
    text-align: center;
    margin-bottom: 40px;
}

.search-bar-wrapper {
    background: white;
    border-radius: 8px;
    padding: 8px;
    display: flex;
    margin-top: 20px;
}

.search-bar-wrapper input {
    flex: 1;
    border: none;
    padding: 10px;
    outline: none;
    font-size: 1rem;
}

.search-btn {
    background-color: #2b6cb0;
    color: white;
    border: none;
    padding: 10px 24px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
}
