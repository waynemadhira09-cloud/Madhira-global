<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MADHIRA GLOBAL</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b1426; /* Deep navy background */
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ========================================================
           1. INITIAL AUTHENTICATION SCREEN (Shows First)
           ======================================================== */
        #auth-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100%;
            max-width: 450px;
            padding: 20px;
            text-align: center;
        }

        .brand-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .brand-logo {
            font-size: 2rem;
            font-weight: bold;
        }

        .hero-title {
            font-size: 2.2rem;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .hero-tagline {
            color: #8fa0dd;
            margin-bottom: 40px;
            font-size: 1rem;
        }

        .auth-box {
            background-color: #131c2e;
            width: 100%;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            display: none;
        }

        .auth-box.active {
            display: block;
        }

        .auth-box h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: #8fa0dd;
            margin-bottom: 6px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background: #1e2d4a;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            color: #fff;
            outline: none;
            font-size: 0.95rem;
        }

        .input-group input:focus {
            border-color: #2b6cb0;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #2b6cb0; /* Search button blue */
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .toggle-link {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #8fa0dd;
        }

        .toggle-link span {
            color: #2b6cb0;
            cursor: pointer;
            font-weight: bold;
        }

        /* ========================================================
           2. MAIN DASHBOARD CONTENT (Hidden until login/signup)
           ======================================================== */
        #main-platform {
            display: none; /* Kept completely hidden at startup */
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }

        /* Styles mimicking your original UI setup */
        .top-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            margin-bottom: 30px;
        }

        .search-container {
            text-align: center;
            margin-bottom: 40px;
        }

        .search-bar-wrapper {
            background: white;
            border-radius: 8px;
            padding: 8px;
            display: flex;
            margin-top: 20px;
        }

        .search-bar-wrapper input {
            flex: 1;
            border: none;
            padding: 10px;
            outline: none;
            font-size: 1rem;
        }

        .search-btn {
            background-color: #2b6cb0;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .categories-section h3 {
            font-size: 1.4rem;
            margin-bottom: 20px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .category-card {
            background-color: #ffffff;
            color: #333333;
            padding: 24px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .category-icon {
            display: block;
            font-size: 1.5rem;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <!-- STAGE 1: GATEWAY WALL (ONLY SIGN IN / SIGN UP SHOWN) -->
    <div id="auth-screen">
        <div class="brand-header">
            <span style="font-size: 2.2rem;">🌐</span>
            <span class="brand-logo">Madhira Global</span>
        </div>
        
        <h1 class="hero-title">Buy & Sell Anything Worldwide</h1>
        <p class="hero-tagline">Find products from sellers around the world.</p>

        <!-- Sign In Box -->
        <div id="signin-box" class="auth-box active">
            <h2>Sign In</h2>
            <form onsubmit="handleAuthentication(event)">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" required placeholder="name@example.com">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="submit-btn">Sign In</button>
            </form>
            <div class="toggle-link">
                New to the platform? <span onclick="switchForm('signup')">Sign Up here</span>
            </div>
        </div>

        <!-- Sign Up Box -->
        <div id="signup-box" class="auth-box">
            <h2>Create Account</h2>
            <form onsubmit="handleAuthentication(event)">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" required placeholder="John Doe">
                </div>
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" required placeholder="name@example.com">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" required placeholder="Create password">
                </div>
                <button type="submit" class="submit-btn">Sign Up</button>
            </form>
            <div class="toggle-link">
                Already have an account? <span onclick="switchForm('signin')">Sign In here</span>
            </div>
        </div>
    </div>


    <!-- STAGE 2: ACCESS GRANTED (CARS, PROPERTY, ELECTRONICS REVEALED) -->
    <div id="main-platform">
        <header class="top-navbar">
            <div class="brand-header" style="margin-bottom: 0;">
                <span>🌐</span>
                <span class="brand-logo" style="font-size: 1.4rem;">Madhira Global</span>
            </div>
            <button class="search-btn" style="background: #131c2e; border: 1px solid rgba(255,255,255,0.2);">Sell</button>
        </header>

        <section class="search-container">
            <div class="search-bar-wrapper">
                <input type="text" placeholder="What are you looking for?">
                <button class="search-btn">Search</button>
            </div>
        </section>

        <section class="categories-section">
            <h3>Explore Categories</h3>
            <div class="grid-container">
                <div class="category-card"><span class="category-icon">🚗</span> Cars</div>
                <div class="category-card"><span class="category-icon">🏠</span> Property</div>
                <div class="category-card"><span class="category-icon">📱</span> Electronics</div>
                <div class="category-card"><span class="category-icon">👕</span> Fashion</div>
                <div class="category-card"><span class="category-icon">🛋️</span> Furniture</div>
                <div class="category-card"><span class="category-icon">⚙️</span> Machinery</div>
            </div>
        </section>
    </div>

    <!-- Interface Controller Logic -->
    <script>
        // Toggles entry forms back and forth on the standalone login wall
        function switchForm(target) {
            document.getElementById('signin-box').classList.remove('active');
            document.getElementById('signup-box').classList.remove('active');
            
            if(target === 'signup') {
                document.getElementById('signup-box').classList.add('active');
            } else {
                document.getElementById('signin-box').classList.add('active');
            }
        }

        // Triggers transition from Auth screen straight into your categories app grid
        function handleAuthentication(event) {
            event.preventDefault(); // Prevents default page refresh
            
            // Hide the isolated auth page completely
            document.getElementById('auth-screen').style.display = 'none';
