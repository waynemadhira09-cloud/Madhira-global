<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- FontAwesome used for matching icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* Fixed Bottom Navigation Container */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: #0b1a2d; /* Matching dark blue background */
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #1a2c42;
            z-index: 9999;
        }

        /* Nav Item Styles */
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #8fa0b5; /* Default muted text color */
            font-size: 11px;
            position: relative;
            flex: 1;
            height: 100%;
        }

        .nav-item i {
            font-size: 18px;
            margin-bottom: 4px;
        }

        /* Highlighted/Active State (Like the Account & Menu buttons) */
        .nav-item.active {
            color: #f7ca18; /* Yellow highlight color */
        }

        /* Deposit Button Specific Wrapper for Badge Placement */
        .deposit-wrapper {
            position: relative;
        }

        /* 3% Deposit Promo Badge */
        .badge {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #e74c3c; /* Red background */
            color: white;
            font-size: 9px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 10px;
            white-space: nowrap;
        }

        .badge::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 4px 4px 0;
            border-style: solid;
            border-color: #e74c3c transparent;
        }
    </style>
</head>
<body>

    <nav class="bottom-nav">
        <!-- Menu Link (Active/Yellow) -->
        <a href="#menu" class="nav-item active">
            <i class="fa-solid fa-bars"></i>
            <span>Menu</span>
        </a>

        <!-- Lobby Link -->
        <a href="#lobby" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Lobby</span>
        </a>

        <!-- Deposit Link with 3% Promo Badge -->
        <a href="#deposit" class="nav-item">
            <div class="deposit-wrapper">
                <span class="badge">3%</span>
                <i class="fa-solid fa-circle-arrow-down"></i>
            </div>
            <span>Deposit</span>
        </a>

        <!-- Promo Link -->
        <a href="#promo" class="nav-item">
            <i class="fa-solid fa-star"></i>
            <span>Promo</span>
        </a>

        <!-- Account Link (Active/Yellow) -->
        <a href="#account" class="nav-item active">
            <i class="fa-solid fa-user"></i>
            <span>Account</span>
        </a>
    </nav>

</body>
</html>
