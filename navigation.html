<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Madhira Global Navigation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #07111F;
            font-family: Arial, sans-serif;
            color: white;
        }

        /* =========================
           SIDE NAVIGATION
        ========================= */

        .madhira-side-nav {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;

            width: 105px;

            background: #091827;
            border-right: 1px solid #173A5C;

            padding: 14px 8px 85px;

            display: flex;
            flex-direction: column;
            align-items: center;

            gap: 9px;

            overflow-y: auto;

            z-index: 1000;
        }

        .madhira-side-nav::-webkit-scrollbar {
            width: 3px;
        }

        .madhira-side-nav::-webkit-scrollbar-thumb {
            background: #1769AA;
            border-radius: 10px;
        }


        /* =========================
           SIDE BUTTONS
        ========================= */

        .side-nav-item {
            width: 89px;
            min-height: 70px;

            padding: 8px 4px;

            border: 1px solid #1B4B72;
            border-radius: 12px;

            background: #102A43;

            color: white;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-decoration: none;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease,
                border 0.2s ease;
        }


        .side-nav-item span {
            font-size: 28px;
            line-height: 30px;
        }


        .side-nav-item small {
            margin-top: 6px;

            color: #FFFFFF;

            font-size: 10px;
            font-weight: 700;

            text-align: center;
            white-space: nowrap;
        }


        /* HOVER */

        .side-nav-item:hover {
            background: #0878D1;

            border-color: #35B5FF;

            transform: translateY(-2px);

            box-shadow:
                0 5px 16px rgba(0, 126, 255, 0.25);
        }


        /* ACTIVE */

        .side-nav-item.active {
            background: linear-gradient(
                145deg,
                #0869B5,
                #159DFF
            );

            border-color: #4CC0FF;

            box-shadow:
                0 0 18px rgba(25, 167, 255, 0.35);
        }


        /* =========================
           VIP
        ========================= */

        .vip-nav {
            background: linear-gradient(
                145deg,
                #4A3500,
                #B47A00
            );

            border-color: #F5C542;

            box-shadow:
                0 0 12px rgba(245, 197, 66, 0.20);
        }

        .vip-nav small {
            color: #FFE58A;
        }


        /* =========================
           JACKPOT
        ========================= */

        .jackpot-nav {
            background: linear-gradient(
                145deg,
                #102B48,
                #155D91
            );
        }


        /* =========================
           AVIATOR
        ========================= */

        .aviator-nav {
            min-height: 78px;

            background: linear-gradient(
                145deg,
                #075EA8,
                #12A8FF
            );

            border: 2px solid #54C7FF;

            box-shadow:
                0 0 20px rgba(18, 168, 255, 0.38);
        }

        .aviator-nav span {
            font-size: 32px;
        }

        .aviator-nav small {
            font-size: 11px;
            font-weight: 900;
            color: white;
        }


        /* =========================
           BOTTOM NAVIGATION
        ========================= */

        .madhira-bottom-nav {
            position: fixed;

            left: 105px;
            right: 0;
            bottom: 0;

            height: 78px;

            background: #091827;

            border-top: 1px solid #173A5C;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 10px;

            padding: 7px 12px;

            z-index: 1100;
        }


        .bottom-nav-item {
            flex: 1;

            max-width: 150px;

            height: 62px;

            border: 1px solid #1B4B72;
            border-radius: 12px;

            background: #102A43;

            color: #B9CDE0;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-decoration: none;

            cursor: pointer;

            transition: 0.2s ease;
        }


        .bottom-nav-item span {
            font-size: 25px;
        }


        .bottom-nav-item small {
            margin-top: 4px;

            font-size: 10px;
            font-weight: 700;
        }


        .bottom-nav-item:hover,
        .bottom-nav-item.active {
            background: #0878D1;

            border-color: #35B5FF;

            color: white;

            box-shadow:
                0 0 14px rgba(25, 167, 255, 0.25);
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .madhira-side-nav {
                width: 96px;
                padding-left: 6px;
                padding-right: 6px;
            }

            .side-nav-item {
                width: 84px;
                min-height: 68px;
            }

            .side-nav-item span {
                font-size: 27px;
            }

            .side-nav-item small {
                font-size: 9px;
            }

            .aviator-nav {
                min-height: 76px;
            }

            .madhira-bottom-nav {
                left: 96px;
                height: 72px;

                gap: 6px;
                padding: 6px;
            }

            .bottom-nav-item {
                height: 58px;
            }

            .bottom-nav-item span {
                font-size: 22px;
            }

            .bottom-nav-item small {
                font-size: 8px;
            }
        }
    </style>
</head>
